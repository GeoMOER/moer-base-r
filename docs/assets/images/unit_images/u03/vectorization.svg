<text x="793" y="650" dy=".35em" font-size="38"><tspan fill="#83bc37">7</tspan></text>
<rect x="906" y="568" width="148" height="164" rx="25" fill="#08769d" stroke="#808080" stroke-width="3"/>
<text x="980" y="650" dy=".35em" font-size="38"><tspan fill="#83bc37">-1</tspan></text>
<path d="M 1150 175 V 650" stroke="#00b6df" stroke-width="7" marker-end="url(#arrow)"/>
<text x="66" y="164" dy=".35em" font-size="34" fill="black">vec1</text>
<text x="66" y="650" dy=".35em" font-size="34" fill="black">vec2</text>
<text x="1175" y="391" dy=".35em" font-size="34" text-anchor="start"><tspan fill="black">vec2 = vec1</tspan><tspan fill="#83bc37">+1</tspan></text>
</g>
</svg>
